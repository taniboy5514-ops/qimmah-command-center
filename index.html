<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0714">
<title>Qimmah Digital — CEO Command Center v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link id="favicon" rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo-mark"><img data-logo src="logo.png" alt="Qimmah Digital logo"></div>
      <div>
        <div class="brand-name">CEO COMMAND CENTER <span class="vtag">v2</span></div>
        <div class="brand-sub">Qimmah Digital · قمة ديجيتال</div>
      </div>
      <div class="owner-badge">Sultan — OWNER</div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="view"></main>
  <footer class="foot">Qimmah Digital — one founder, 60 AI agents · Data lives on this device + optional Supabase sync</footer>
</div>
<div id="toast" class="toast"></div>
<script src="logo.js"></script>
<script>if(window.LOGO_DATA_URI){document.querySelectorAll("img[data-logo],#favicon,#appleicon").forEach(e=>e.href!==undefined&&e.tagName==="LINK"?e.href=window.LOGO_DATA_URI:e.src=window.LOGO_DATA_URI);}</script>
<script src="app.js"></script>
</body>
</html>
